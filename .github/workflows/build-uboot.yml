name: build-uboot-cupid

# Build HakiOS's U-Boot for the Xiaomi 12 from the common repository at a pinned revision, with
# this device repository linked in as devices/cupid. The phone's own Android device tree is the
# firmware: U-Boot is built with EXT_DTB pointing at it. Nothing is flashed. A green run means the
# image builds; it is not a boot test.

on:
  workflow_dispatch:
    inputs:
      beacon:
        description: 'Bring-up paints: magenta at the top of _main (assembly), cyan at board_init_f (C)'
        required: false
        default: ''
        type: string
      payload_base:
        description: 'Address where the loader/payload is placed (hex literal)'
        required: false
        default: '0xB0000000UL'
        type: string
  push:
    branches: [uboot-cupid]
    paths:
      - "u-boot/**"
      - ".github/workflows/build-uboot.yml"

permissions:
  contents: read

env:
  COMMON_REV: 63fc2b4633bac3af8e57dadab9f5a8d4cb940438
  DEVICE: cupid

jobs:
  uboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout the device repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git make gcc-aarch64-linux-gnu device-tree-compiler \
            bison flex libssl-dev python3 python3-pip curl ca-certificates
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone the common repository and link this device
        run: |
          set -euo pipefail
          git init -q common
          git -C common remote add origin https://github.com/oosexgang/hakios-xnu-kernel.git
          git -C common fetch --depth 1 origin "$COMMON_REV"
          git -C common checkout -q FETCH_HEAD
          rm -rf common/devices/cupid
          ln -s "$GITHUB_WORKSPACE" common/devices/cupid
          echo "common at $(git -C common rev-parse HEAD)"

      - name: Prepare the phone's device tree and boot-image tool
        run: |
          set -euo pipefail
          mkdir -p common/devices/cupid/prebuilt
          # The boot-image packer is a generic tool from the redwood device repository at a pinned
          # commit; no redwood device configuration is copied into cupid.
          curl -fsSL -o common/devices/cupid/prebuilt/mkbootimg.py \
            https://raw.githubusercontent.com/oosexgang/hakios-sm7325/af52dfba33f91340bde68dbbe238ae583f9fd472/prebuilt/mkbootimg.py
          cp uefi/files/Resources/DTBs/cupid.dtb common/devices/cupid/prebuilt/device-tree.dtb
          file common/devices/cupid/prebuilt/device-tree.dtb

      - name: Clone HakiOS's UEFI
        run: |
          set -euo pipefail
          git init -q hakios-uefi
          git -C hakios-uefi remote add origin https://github.com/oosexgang/hakios-uefi.git
          git -C hakios-uefi fetch --depth 1 origin 1c6522893266157506c767e2ca427053ed3634a8
          git -C hakios-uefi checkout -q FETCH_HEAD
          mkdir -p devices
          ln -s "$GITHUB_WORKSPACE" devices/cupid
          echo "hakios-uefi at $(git -C hakios-uefi rev-parse HEAD)"

      - name: Assemble HakiOS's U-Boot with the cupid files
        run: |
          U_BOOT="$GITHUB_WORKSPACE/uboot-tree" "$GITHUB_WORKSPACE/hakios-uefi/u-boot/apply.sh" cupid

      - name: The phone's device tree, with a framebuffer the console can use
        run: |
          set -euo pipefail
          dtc -I dtb -O dts -q -o cupid.dts uefi/files/Resources/DTBs/cupid.dtb
          python3 tools/uboot-dts.py --in cupid.dts --out cupid-u-boot.dts --usb-peripheral
          dtc -I dts -O dtb -o cupid-u-boot.dtb cupid-u-boot.dts
          dtc -I dtb -O dts cupid-u-boot.dtb | grep -q 'simple-framebuffer'
          cp cupid-u-boot.dts uboot-tree/dts/upstream/src/arm64/qcom/sm8450-xiaomi-cupid.dts
          # the image ABL starts carries the same tree: the console and the payload window must be
          # in the tree ABL hands over, not only in the one U-Boot compiles
          cp cupid-u-boot.dtb common/devices/cupid/prebuilt/device-tree.dtb

      - name: Bring-up beacon (optional)
        if: inputs.beacon != ''
        run: |
          set -euo pipefail
          # Two colours, one boot: magenta in the top quarter as soon as U-Boot's assembly entry runs,
          # cyan over the whole panel when its first C function runs. Cyan means both ran and the
          # problem is further on (video, device model); magenta alone means the C world never
          # started; neither means the image never executed at all.
          python3 - <<'PY'
          import re
          p = "uboot-tree/arch/arm/lib/crt0_64.S"
          s = open(p).read()
          m = re.search(r"\nENTRY\(_main\)\n", s)
          assert m, "no ENTRY(_main) in crt0_64.S"
          asm = (
              "\t/* cupid bring-up: paint the top quarter of the live framebuffer magenta */\n"
              "\tldr\tx7, =0xB8000000\n"
              "\tldr\tx8, =(1080 * 600)\n"
              "\tmovz\tw9, #0x00ff\n"
              "\tmovk\tw9, #0xffff, lsl #16\n"
              "1:\tstr\tw9, [x7], #4\n"
              "\tsubs\tx8, x8, #1\n"
              "\tb.ne\t1b\n"
              "\tdsb\tsy\n"
          )
          s = s[:m.end()] + asm + s[m.end():]
          open(p, "w").write(s)

          p = "uboot-tree/common/board_f.c"
          s = open(p).read()
          a = "void board_init_f(ulong boot_flags)\n{\n"
          assert s.count(a) == 1, "unexpected board_init_f"
          c = ("\t/* cupid bring-up: the first C code U-Boot runs paints the whole panel cyan */\n"
               "\t{\n\t\tvolatile uint32_t *f = (volatile uint32_t *)0xB8000000UL;\n"
               "\t\tunsigned i;\n"
               "\t\tfor (i = 0; i < 1080u * 2400u; i++)\n\t\t\tf[i] = 0xFF00FFFFu;\n\t}\n")
          open(p, "w").write(s.replace(a, a + c))
          print("beacons in: crt0_64.S (magenta top quarter) and board_f.c (cyan)")
          PY

      - name: Build U-Boot with cupid's own device tree
        env:
          EXT_DTB: ${{ github.workspace }}/cupid-u-boot.dtb
          CROSS_COMPILE: aarch64-linux-gnu-
          U_BOOT: ${{ github.workspace }}/uboot-tree
          PAYLOAD_BASE: ${{ inputs.payload_base || '0xB0000000UL' }}
        run: |
          # 0xF0000000 sits inside SM8450's TZ apps carve-out; the waipio family's measured payload
          # base is 0xB0000000 (see docs/boot-runbook.md).
          sed -i "s/#define PAYLOAD_BASE.*/#define PAYLOAD_BASE\t\t$PAYLOAD_BASE/" "$GITHUB_WORKSPACE/uboot-tree/cmd/hakios.c"
          grep -n 'define PAYLOAD_BASE' "$GITHUB_WORKSPACE/uboot-tree/cmd/hakios.c"
          "$GITHUB_WORKSPACE/hakios-uefi/u-boot/build.sh" cupid

      - name: Pack a boot image with no payload
        run: |
          set -euo pipefail
          # Header v4 with os_version/os_patch_level 0: waipio's ABL accepts anything else and boots
          # the slot instead of the image (docs/boot-runbook.md).
          python3 tools/mkuboot-cupid.py --uboot "$GITHUB_WORKSPACE/uboot-tree/build-cupid/u-boot.bin" \
            --dtb "$GITHUB_WORKSPACE/cupid-u-boot.dtb" \
            --mkbootimg "$GITHUB_WORKSPACE/common/devices/cupid/prebuilt/mkbootimg.py" \
            --out "$GITHUB_WORKSPACE/hakios-u-boot.img"
          sha256sum "$GITHUB_WORKSPACE/hakios-u-boot.img"

      - name: Upload the U-Boot build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cupid-uboot
          path: |
            hakios-u-boot.img
            uboot-tree/build-cupid/u-boot.bin
            uboot-tree/build-cupid/.config
            cupid-u-boot.dts
            cupid-u-boot.dtb
          if-no-files-found: error
          retention-days: 30

      - name: Report
        if: always()
        run: |
          echo "## cupid U-Boot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- common repository: \`$COMMON_REV\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- U-Boot: \`$(cat hakios-uefi/u-boot/BASE 2>/dev/null || echo unknown)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- device tree: the phone's own \`uefi/files/Resources/DTBs/cupid.dtb\` (EXT_DTB)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A built image is not a boot test. Do not flash it: \`fastboot boot\` only." >> "$GITHUB_STEP_SUMMARY"
