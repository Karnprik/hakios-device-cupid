[boot_shim]
requires_kernel_header = true

[uefi_fd]
# The FD must NOT sit in the phone's own firmware window. cupid's uefi_a.img is an ELF64 whose
# PT_LOAD maps the vendor FV at 0xA7000000 with filesz 0x2a0000, and the tree calls that window
# "mem dump" - it is live firmware territory, possibly XPU-protected. Both 0xA7000000 and
# 0xA7100000 produced an instant silent death, which is what a write/jump into protected memory
# looks like. The FD therefore goes into the free span its own carve-out list leaves after adsp:
# 0xA2E00000-0xA6B80000 (xbl_ramdump starts at 0xA6B80000).
base = 0xA2F00000
size = 0x300000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

[boot_image]
header_version = 4
[vendor_drivers]
# "none" = blob-free: the DXE list carries no Binaries/cupid/ entries. The phone's own DXE set
# stops this SoC family from booting (ClockDxe halts the panel scanout, PmicDxe aborts on SPMI),
# so the platform runs on the SoC package alone until a single driver is proven here.
mode = "none"
