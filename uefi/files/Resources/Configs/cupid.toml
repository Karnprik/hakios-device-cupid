[boot_shim]
requires_kernel_header = true

[uefi_fd]
# The phone's own uefi_a.img is an ELF64 whose PT_LOAD maps the FV at 0xA7000000
# (filesz 0x2a0000). Use that measured address instead of the earlier guess in the gap
# after ADSP, which never produced a display or a loader on the first boot attempt.
base = 0xA7000000
size = 0x300000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

[boot_image]
header_version = 4
